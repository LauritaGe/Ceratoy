name: Generate Daily Article

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC diario
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema opcional para la noticia"
        required: false
        type: string
      skip_image:
        description: "Omitir generación de imagen"
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-sonnet-4-20250514' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'black-forest-labs/flux-schnell' }}
        run: |
          ARGS="--generate"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.skip_image }}" = "true" ]; then
            ARGS="$ARGS --skip-image"
          fi
          python orchestrator.py $ARGS

      - name: Commit and push
        run: |
          git config user.name "todo-es-verdad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ../content/posts ../web/public/images
          git diff --staged --quiet || git commit -m "content: nueva noticia generada por pipeline [skip ci]"
          git push
